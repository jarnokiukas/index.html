<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Turnaround Scanner</title>
  <meta name="description" content="AI-agentti käänneyhtiöiden tunnistamiseen EU ja US pörsseistä" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#010409" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Turnaround" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #010409; color: #e6edf3; font-family: 'DM Sans', sans-serif; }
    @keyframes slideIn { from { opacity:0; transform:translateY(16px); } to { opacity:1; transform:translateY(0); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0d1117; }
    ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }
    select { font-family: 'DM Sans', sans-serif; }
    button { font-family: 'DM Sans', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const MARKETS = ["US (NYSE/NASDAQ)", "EU (Euronext/Xetra/OMX)", "Molemmat"];
    const SECTORS = ["Kaikki", "Teknologia", "Teollisuus", "Terveydenhuolto", "Energia", "Kuluttaja", "Rahoitus"];

    const SYSTEM_PROMPT = `Olet käänneyhtiö-analyytikko. Etsi oikeita pörssiyrityksiä jotka ovat klassisia "turnaround" eli käänneyhtiöitä.

KRITEERIT:
1. Ollut tappiollinen 1-3 vuotta mutta kääntymässä/kääntynyt voitolliseksi
2. Arvostus kohtuullinen odotetulle tulokselle
3. Selkeä katalysaattori: uusi johto, restrukturointi, uusi tuote, kustannusleikkaukset
4. Tase kestää
5. Analyytikoiden konsensus parantunut

VASTAA VAIN TÄSSÄ JSON-MUODOSSA, ei muuta tekstiä:
{
  "companies": [
    {
      "name": "Yhtiön nimi",
      "ticker": "TICKER",
      "exchange": "NYSE/NASDAQ/Euronext/Xetra/OMX",
      "country": "Maa",
      "sector": "Toimiala",
      "currentPrice": "~$XX tai ~€XX",
      "marketCap": "~$XB tai ~€XM",
      "turnaroundStory": "2-3 lausetta miksi käänneyhtiö",
      "catalysts": ["katalysaattori 1", "katalysaattori 2", "katalysaattori 3"],
      "financialSnapshot": {
        "revenueGrowth": "+X% YoY",
        "marginTrend": "negatiivinen positiivinen",
        "debtLevel": "velkataso",
        "analystConsensus": "X Osta, Y Pida, Z Myy"
      },
      "valuation": {
        "forwardPE": "Xx",
        "evEbitda": "Xx",
        "priceToSales": "X.Xx",
        "verdict": "arvostuskommentti"
      },
      "risks": ["riski 1", "riski 2"],
      "confidenceScore": 75,
      "timeHorizon": "12-24 kk"
    }
  ],
  "marketContext": "Lyhyt kommentti markkinatilanteesta",
  "scanTimestamp": "2025-05-24T08:00:00Z",
  "totalFound": 6
}

Anna 5-6 OIKEAA yhtiota. Pida vastaukset tiiviina.`;

    function buildUserPrompt(market, sector, riskLevel) {
      const marketText = market === "Molemmat" ? "seka Euroopan etta Yhdysvaltojen porsseista" :
        market === "EU (Euronext/Xetra/OMX)" ? "Euroopan porsseista (Euronext, Xetra, OMX Helsinki/Stockholm/Copenhagen)" :
        "Yhdysvaltojen porsseista (NYSE, NASDAQ)";
      const sectorText = sector === "Kaikki" ? "kaikilta toimialoilta" : `erityisesti ${sector.toLowerCase()}-sektorilta`;
      const riskText = riskLevel === "matala" ? "Suosi suurempia, vakaampia yhtioita joissa kaanne on jo selkea." :
        riskLevel === "korkea" ? "Voit sisallyttaa pienempia, riskisempia yhtioita joissa kaanne on vasta alkamassa." :
        "Sekoita seka jo kaanteen tehneita etta vasta kaantyvia yhtioita.";
      return `Etsi ${marketText} ${sectorText} kaanneyhtioita (turnaround stocks) vuodelle 2025-2026. ${riskText} Muista JSON-vastausformaatti.`;
    }

    function ScoreBar({ score }) {
      const color = score >= 75 ? "#00ff88" : score >= 55 ? "#ffd700" : "#ff6b6b";
      return (
        <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
          <div style={{ flex:1, height:"6px", background:"#1a1a2e", borderRadius:"3px", overflow:"hidden" }}>
            <div style={{ width:`${score}%`, height:"100%", background:color, borderRadius:"3px", transition:"width 1s ease" }} />
          </div>
          <span style={{ color, fontWeight:"700", fontSize:"13px", minWidth:"35px" }}>{score}%</span>
        </div>
      );
    }

    function CompanyCard({ company, index }) {
      const [expanded, setExpanded] = useState(false);
      const color = company.confidenceScore >= 75 ? "#00ff88" : company.confidenceScore >= 55 ? "#ffd700" : "#ff6b6b";
      return (
        <div onClick={() => setExpanded(!expanded)} style={{
          background:"linear-gradient(135deg,#0d1117 0%,#161b22 100%)",
          border:`1px solid ${expanded ? color : "#30363d"}`,
          borderRadius:"12px", padding:"20px", cursor:"pointer",
          transition:"all 0.3s ease",
          animationDelay:`${index*0.1}s`,
          animation:"slideIn 0.5s ease forwards", opacity:0
        }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"12px" }}>
            <div>
              <div style={{ display:"flex", alignItems:"center", gap:"8px", marginBottom:"4px", flexWrap:"wrap" }}>
                <span style={{ fontFamily:"'IBM Plex Mono',monospace", fontSize:"20px", fontWeight:"700", color, letterSpacing:"1px" }}>{company.ticker}</span>
                <span style={{ background:"#1c2128", border:"1px solid #30363d", borderRadius:"4px", padding:"2px 8px", fontSize:"11px", color:"#8b949e" }}>{company.exchange}</span>
                <span style={{ background:"#1c2128", border:"1px solid #30363d", borderRadius:"4px", padding:"2px 8px", fontSize:"11px", color:"#8b949e" }}>{company.country}</span>
              </div>
              <div style={{ fontSize:"16px", fontWeight:"600", color:"#e6edf3", marginBottom:"2px" }}>{company.name}</div>
              <div style={{ fontSize:"12px", color:"#8b949e" }}>{company.sector} • {company.marketCap}</div>
            </div>
            <div style={{ textAlign:"right", flexShrink:0, marginLeft:"12px" }}>
              <div style={{ fontSize:"16px", fontWeight:"700", color:"#e6edf3", fontFamily:"'IBM Plex Mono',monospace" }}>{company.currentPrice}</div>
              <div style={{ fontSize:"11px", color:"#8b949e", marginTop:"2px" }}>⏱ {company.timeHorizon}</div>
            </div>
          </div>
          <div style={{ marginBottom:"12px" }}>
            <div style={{ fontSize:"12px", color:"#8b949e", marginBottom:"4px", textTransform:"uppercase", letterSpacing:"0.5px" }}>Luottamus</div>
            <ScoreBar score={company.confidenceScore} />
          </div>
          <p style={{ fontSize:"13px", color:"#c9d1d9", lineHeight:"1.6", margin:0 }}>{company.turnaroundStory}</p>
          {expanded && (
            <div style={{ marginTop:"20px", borderTop:"1px solid #30363d", paddingTop:"20px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"16px", marginBottom:"16px" }}>
                <div>
                  <div style={{ fontSize:"11px", color:"#8b949e", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:"8px" }}>📊 Taloustiedot</div>
                  <div style={{ fontSize:"12px", color:"#c9d1d9", lineHeight:"1.8" }}>
                    <div>Kasvu: <span style={{ color:"#00ff88" }}>{company.financialSnapshot?.revenueGrowth}</span></div>
                    <div>Marginaali: <span style={{ color:"#ffd700" }}>{company.financialSnapshot?.marginTrend}</span></div>
                    <div>Velka: {company.financialSnapshot?.debtLevel}</div>
                    <div>Analyytikot: <span style={{ color:"#58a6ff" }}>{company.financialSnapshot?.analystConsensus}</span></div>
                  </div>
                </div>
                <div>
                  <div style={{ fontSize:"11px", color:"#8b949e", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:"8px" }}>💰 Arvostus</div>
                  <div style={{ fontSize:"12px", color:"#c9d1d9", lineHeight:"1.8" }}>
                    <div>Fwd P/E: <span style={{ color:"#00ff88" }}>{company.valuation?.forwardPE}</span></div>
                    <div>EV/EBITDA: {company.valuation?.evEbitda}</div>
                    <div>P/S: {company.valuation?.priceToSales}</div>
                  </div>
                  <div style={{ marginTop:"8px", fontSize:"12px", color:"#58a6ff", fontStyle:"italic" }}>{company.valuation?.verdict}</div>
                </div>
              </div>
              <div style={{ marginBottom:"12px" }}>
                <div style={{ fontSize:"11px", color:"#8b949e", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:"8px" }}>🚀 Katalysaattorit</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
                  {company.catalysts?.map((c,i) => (
                    <span key={i} style={{ background:"#0d2818", border:"1px solid #00ff8830", borderRadius:"6px", padding:"4px 10px", fontSize:"12px", color:"#00ff88" }}>{c}</span>
                  ))}
                </div>
              </div>
              <div>
                <div style={{ fontSize:"11px", color:"#8b949e", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:"8px" }}>⚠️ Riskit</div>
                <div style={{ display:"flex", flexWrap:"wrap", gap:"6px" }}>
                  {company.risks?.map((r,i) => (
                    <span key={i} style={{ background:"#2d1010", border:"1px solid #ff6b6b30", borderRadius:"6px", padding:"4px 10px", fontSize:"12px", color:"#ff6b6b" }}>{r}</span>
                  ))}
                </div>
              </div>
            </div>
          )}
          <div style={{ marginTop:"12px", fontSize:"11px", color:"#58a6ff", textAlign:"right" }}>{expanded ? "▲ Sulje" : "▼ Näytä lisää"}</div>
        </div>
      );
    }

    function AgentLog({ logs, isScanning }) {
      const ref = useRef(null);
      useEffect(() => { if (ref.current) ref.current.scrollTop = ref.current.scrollHeight; }, [logs]);
      return (
        <div ref={ref} style={{
          background:"#0d1117", border:"1px solid #30363d", borderRadius:"8px",
          padding:"16px", height:"160px", overflowY:"auto",
          fontFamily:"'IBM Plex Mono',monospace", fontSize:"12px"
        }}>
          {logs.length === 0 && <span style={{ color:"#484f58" }}>Odottaa käynnistystä...</span>}
          {logs.map((log,i) => (
            <div key={i} style={{
              color: log.type==="error"?"#ff6b6b": log.type==="success"?"#00ff88": log.type==="info"?"#58a6ff":"#8b949e",
              marginBottom:"4px", display:"flex", gap:"8px"
            }}>
              <span style={{ color:"#484f58", minWidth:"70px" }}>{log.time}</span>
              <span>{log.type==="success"?"✓": log.type==="error"?"✗": log.type==="info"?"→":"·"}</span>
              <span>{log.message}</span>
            </div>
          ))}
        </div>
      );
    }

    function App() {
      const [market, setMarket] = useState("Molemmat");
      const [sector, setSector] = useState("Kaikki");
      const [riskLevel, setRiskLevel] = useState("keskitaso");
      const [isScanning, setIsScanning] = useState(false);
      const [results, setResults] = useState(null);
      const [logs, setLogs] = useState([]);
      const [error, setError] = useState(null);

      const addLog = (message, type="default") => {
        const time = new Date().toTimeString().slice(0,8);
        setLogs(prev => [...prev, { message, type, time }]);
      };

      const runScan = async () => {
        setIsScanning(true); setResults(null); setError(null); setLogs([]);
        addLog("Agentti käynnistyy...", "info");
        addLog(`Parametrit: ${market} | ${sector} | Riski: ${riskLevel}`, "default");
        addLog("Yhdistetään Gemini API:in...", "info");
        try {
          await new Promise(r => setTimeout(r, 500));
          addLog("Yhteys muodostettu. Analysoidaan...", "success");
          const apiKey = localStorage.getItem("gemini_api_key");
          if (!apiKey) throw new Error("Anna API-avain ensin asetuksissa");
          const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${apiKey}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              contents: [{ parts: [{ text: SYSTEM_PROMPT + "\n\n" + buildUserPrompt(market, sector, riskLevel) }] }],
              generationConfig: { maxOutputTokens: 8000, temperature: 0.7 }
            })
          });
          if (!response.ok) throw new Error(`API-virhe: ${response.status}`);
          addLog("Vastaanotettu analyysi...", "info");
          const data = await response.json();
          const rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || "";
          addLog("Parsitaan tulokset...", "default");
          let clean = rawText.trim();
          const jsonMatch = clean.match(/\{[\s\S]*\}/);
          if (!jsonMatch) throw new Error("JSON-lohkoa ei löydy");
          clean = jsonMatch[0];
          clean = clean.replace(/\/\/[^\n]*/g, "");
          clean = clean.replace(/\/\*[\s\S]*?\*\//g, "");
          clean = clean.replace(/,\s*([}\]])/g, "$1");
          let parsed;
          try { parsed = JSON.parse(clean); }
          catch(e) { throw new Error("JSON viallinen — yritä uudelleen"); }
          addLog(`Löydettiin ${parsed.companies?.length||0} käänneyhtiötä!`, "success");
          await new Promise(r => setTimeout(r, 300));
          addLog("✦ Skannaus valmis!", "success");
          setResults(parsed);
        } catch(err) {
          addLog(`Virhe: ${err.message}`, "error");
          setError(err.message);
        } finally {
          setIsScanning(false);
        }
      };

      return (
        <div style={{ minHeight:"100vh", background:"#010409", color:"#e6edf3", fontFamily:"'DM Sans',sans-serif", padding:"28px 16px" }}>
          <div style={{ maxWidth:"860px", margin:"0 auto" }}>

            {/* Header */}
            <div style={{ marginBottom:"32px" }}>
              <div style={{ display:"flex", alignItems:"center", gap:"14px" }}>
                <div style={{ width:"42px", height:"42px", background:"linear-gradient(135deg,#00ff88,#00b4d8)", borderRadius:"10px", display:"flex", alignItems:"center", justifyContent:"center", fontSize:"22px", flexShrink:0 }}>⟳</div>
                <div>
                  <h1 style={{ margin:0, fontSize:"26px", fontWeight:"700", letterSpacing:"-0.5px", background:"linear-gradient(90deg,#e6edf3,#00ff88)", WebkitBackgroundClip:"text", WebkitTextFillColor:"transparent" }}>Turnaround Scanner</h1>
                  <div style={{ fontSize:"12px", color:"#8b949e", marginTop:"2px" }}>AI-agentti · Käänneyhtiöt · EU & US</div>
                </div>
              </div>
            </div>

            {/* Controls */}
            <div style={{ background:"linear-gradient(135deg,#0d1117,#161b22)", border:"1px solid #30363d", borderRadius:"16px", padding:"20px", marginBottom:"20px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"12px", marginBottom:"16px" }}>
                {[
                  { label:"Markkina", value:market, set:setMarket, options:MARKETS },
                  { label:"Toimiala", value:sector, set:setSector, options:SECTORS },
                  { label:"Riskitaso", value:riskLevel, set:setRiskLevel, options:["matala","keskitaso","korkea"] }
                ].map(({ label, value, set, options }) => (
                  <div key={label}>
                    <label style={{ display:"block", fontSize:"10px", color:"#8b949e", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:"6px" }}>{label}</label>
                    <select value={value} onChange={e => set(e.target.value)} style={{ width:"100%", background:"#1c2128", border:"1px solid #30363d", borderRadius:"8px", padding:"9px 10px", color:"#e6edf3", fontSize:"13px", outline:"none" }}>
                      {options.map(o => <option key={o} value={o}>{o}</option>)}
                    </select>
                  </div>
                ))}
              </div>
              <div style={{marginBottom:"12px"}}>
                <label style={{display:"block",fontSize:"10px",color:"#8b949e",textTransform:"uppercase",letterSpacing:"0.5px",marginBottom:"6px"}}>Gemini API-avain</label>
                <input
                  type="password"
                  placeholder="AIza..."
                  defaultValue={localStorage.getItem("gemini_api_key")||""}
                  onChange={e => localStorage.setItem("gemini_api_key", e.target.value)}
                  style={{width:"100%",background:"#1c2128",border:"1px solid #30363d",borderRadius:"8px",padding:"9px 10px",color:"#e6edf3",fontSize:"13px",outline:"none"}}
                />
              </div>
              <button onClick={runScan} disabled={isScanning} style={{
                width:"100%", padding:"14px",
                background: isScanning ? "#1c2128" : "linear-gradient(135deg,#00ff88,#00b4d8)",
                border:"none", borderRadius:"10px",
                color: isScanning ? "#8b949e" : "#010409",
                fontSize:"15px", fontWeight:"700", cursor: isScanning ? "not-allowed" : "pointer",
                transition:"all 0.3s ease", display:"flex", alignItems:"center", justifyContent:"center", gap:"10px"
              }}>
                {isScanning
                  ? <><span style={{ display:"inline-block", animation:"spin 1s linear infinite" }}>◌</span> Skannataan...</>
                  : <>⟳ Käynnistä skannaus</>}
              </button>
            </div>

            {/* Log */}
            <div style={{ marginBottom:"20px" }}>
              <div style={{ fontSize:"10px", color:"#8b949e", textTransform:"uppercase", letterSpacing:"0.5px", marginBottom:"6px", display:"flex", alignItems:"center", gap:"6px" }}>
                <span style={{ display:"inline-block", width:"6px", height:"6px", background: isScanning?"#00ff88":"#30363d", borderRadius:"50%", animation: isScanning?"pulse 1s infinite":"none" }} />
                Agentin loki
              </div>
              <AgentLog logs={logs} isScanning={isScanning} />
            </div>

            {/* Error */}
            {error && (
              <div style={{ background:"#2d1010", border:"1px solid #ff6b6b50", borderRadius:"10px", padding:"14px", marginBottom:"20px", color:"#ff6b6b", fontSize:"13px" }}>
                ⚠ {error}
              </div>
            )}

            {/* Results */}
            {results && (
              <div>
                <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"16px" }}>
                  <div>
                    <h2 style={{ margin:0, fontSize:"18px", fontWeight:"600" }}>{results.totalFound || results.companies?.length} käänneyhtiötä</h2>
                    <p style={{ margin:"4px 0 0", fontSize:"12px", color:"#8b949e" }}>{results.marketContext}</p>
                  </div>
                  <div style={{ background:"#0d2818", border:"1px solid #00ff8840", borderRadius:"8px", padding:"6px 12px", fontSize:"11px", color:"#00ff88", fontFamily:"'IBM Plex Mono',monospace" }}>LIVE</div>
                </div>
                <div style={{ display:"flex", flexDirection:"column", gap:"12px" }}>
                  {results.companies?.map((c,i) => <CompanyCard key={i} company={c} index={i} />)}
                </div>
                <div style={{ marginTop:"20px", padding:"14px", background:"#0d1117", border:"1px solid #30363d", borderRadius:"10px", fontSize:"11px", color:"#484f58", lineHeight:"1.6" }}>
                  ⚠ Tämä on AI-analyysi eikä sijoitusneuvonta. Tiedot ovat arvioita. Tee aina oma due diligence ennen sijoituspäätöksiä.
                </div>
              </div>
            )}
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
